<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ses Proje | AI Haber Özeti</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09090b;          /* Derin Antrasit */
            --card: #18181b;        /* Kart Arka Planı */
            --card-hover: #1c1c1f;
            --border: #27272a;      /* İnce Kenarlık */
            --primary: #818cf8;     /* Muted Indigo */
            --text-title: #fafafa;
            --text-body: #a1a1aa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-body);
            line-height: 1.5;
            padding: 80px 24px;
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 680px; margin: 0 auto; }

        /* HEADER */
        header { text-align: left; margin-bottom: 64px; }
        
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .brand-icon {
            color: var(--primary);
            font-size: 24px;
        }

        h1 { font-size: 24px; font-weight: 600; color: var(--text-title); letter-spacing: -0.02em; }
        .tagline { font-size: 15px; color: var(--text-body); font-weight: 400; }

        /* NEWS CARDS */
        .news-list { display: flex; flex-direction: column; gap: 24px; }

        .news-card {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            transition: all 0.2s ease-in-out;
        }

        .news-card:hover {
            border-color: #3f3f46;
            background-color: var(--card-hover);
        }

        .meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            font-size: 12px;
            font-weight: 500;
            color: var(--primary);
            letter-spacing: 0.05em;
        }

        h2 {
            font-size: 19px;
            font-weight: 500;
            color: var(--text-title);
            line-height: 1.4;
            margin-bottom: 24px;
        }

        /* PLAYER CUSTOMIZATION */
        .player-box {
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            padding: 8px;
        }

        audio {
            width: 100%;
            height: 36px;
            filter: invert(100%) hue-rotate(180deg) brightness(0.9);
            opacity: 0.8;
        }

        /* STATUS */
        #status { text-align: center; margin-top: 40px; font-size: 14px; }

        .footer {
            margin-top: 80px;
            padding-top: 32px;
            border-top: 1px solid var(--border);
            font-size: 13px;
            text-align: left;
            opacity: 0.5;
        }

        @media (max-width: 600px) {
            body { padding: 40px 20px; }
            .news-card { padding: 24px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="brand">
            <span class="brand-icon">🎙️</span>
            <h1>Ses Proje</h1>
        </div>
        <p class="tagline">Günün teknoloji özetleri. Yapay zeka ile seslendirildi.</p>
    </header>

    <main id="news-container" class="news-list">
        <div id="status">Haberler hazırlanıyor...</div>
    </main>

    <footer class="footer">
        &copy; 2026 Ses Proje. Tüm hakları saklıdır.
    </footer>
</div>

<script>
    async function fetchNews() {
        const container = document.getElementById('news-container');
        try {
            // S3'ten news.json dosyasını çekiyoruz
            const response = await fetch('news.json?t=' + Date.now());
            if (!response.ok) throw new Error();
            const news = await response.json();
            container.innerHTML = '';

            if (news.length === 0) {
                container.innerHTML = '<div id="status">Henüz yeni bir özet bulunmuyor.</div>';
                return;
            }

            news.forEach(item => {
                const card = document.createElement('div');
                card.className = 'news-card';
                
                // Tarih düzeltme mantığı
                let displayDate = "Bugün";
                if(item.timestamp) {
                    const cleanTs = item.timestamp.replace(' ', 'T');
                    const d = new Date(cleanTs);
                    if (!isNaN(d)) {
                        displayDate = d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
                    }
                }

                card.innerHTML = `
                    <div class="meta"><span>●</span> ${displayDate}</div>
                    <h2>${item.title}</h2>
                    <div class="player-box">
                        <audio controls>
                            <source src="${item.url}" type="audio/mpeg">
                        </audio>
                    </div>
                `;
                container.appendChild(card);
            });
        } catch (e) {
            container.innerHTML = '<div id="status">Şu an haberlere ulaşılamıyor.</div>';
        }
    }
    fetchNews();
</script>
</body>
</html>
