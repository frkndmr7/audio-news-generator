<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ses Proje | AI Haber Akışı</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-forest: #112211;     /* Derin Orman Yeşili */
            --card-cream: #fdfbf7;    /* Yumuşak Krem */
            --accent-orange: #e67e22; /* Şık Turuncu */
            --text-on-green: #e1e8e1; 
            --text-on-cream: #1a2e1a;
            --border-cream: #f3eee7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-forest);
            color: var(--text-on-green);
            line-height: 1.6;
            padding: 80px 24px;
        }

        .container { max-width: 700px; margin: 0 auto; }

        /* HEADER SECTION */
        header { 
            text-align: center; 
            margin-bottom: 80px; 
        }
        
        .logo-area {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 70px;
            background-color: var(--card-cream);
            border-radius: 20px;
            font-size: 32px;
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 2px solid var(--accent-orange);
        }

        h1 { 
            font-size: 36px; 
            font-weight: 800; 
            letter-spacing: -1px; 
            color: var(--card-cream);
            margin-bottom: 12px;
        }
        
        .tagline { 
            color: var(--accent-orange); 
            font-size: 18px; 
            font-weight: 400;
            opacity: 0.9;
        }

        /* NEWS CARDS */
        .news-list { display: flex; flex-direction: column; gap: 32px; }

        .news-card {
            background-color: var(--card-cream);
            border-radius: 28px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--border-cream);
        }

        .news-card:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
        }

        .meta {
            display: inline-block;
            background-color: rgba(230, 126, 34, 0.1);
            color: var(--accent-orange);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 6px 14px;
            border-radius: 100px;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-on-cream);
            line-height: 1.4;
            margin-bottom: 30px;
        }

        /* PLAYER BOX */
        .audio-container {
            background-color: #f1ede6;
            border-radius: 18px;
            padding: 12px;
            border: 1px solid #e5dfd5;
        }

        audio {
            width: 100%;
            height: 40px;
            /* Turuncu ve Yeşil tonlarıyla uyum için hafif filtre */
            filter: sepia(0.2) saturate(1.2) contrast(1.1);
        }

        /* STATUS & FOOTER */
        #status-msg { text-align: center; color: var(--card-cream); font-weight: 300; }

        .footer {
            text-align: center;
            margin-top: 100px;
            padding-top: 40px;
            border-top: 1px solid rgba(255,255,255,0.1);
            color: var(--text-on-green);
            font-size: 14px;
            opacity: 0.6;
        }

        @media (max-width: 600px) {
            body { padding: 40px 16px; }
            .news-card { padding: 28px; }
            h1 { font-size: 28px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo-area">🎙️</div>
        <h1>Ses Proje</h1>
        <p class="tagline">Yapay Zeka ile Doğal Haber Deneyimi</p>
    </header>

    <main id="news-container" class="news-list">
        <div id="status-msg">Haberler toplanıyor...</div>
    </main>

    <footer class="footer">
        &copy; 2026 Ses Proje. Doğadan ilham alan teknoloji.
    </footer>
</div>

<script>
    async function fetchNews() {
        const container = document.getElementById('news-container');
        try {
            // S3'teki news.json'ı tazelemek için timestamp kullanıyoruz
            const response = await fetch('news.json?t=' + Date.now());
            if (!response.ok) throw new Error();
            const news = await response.json();
            container.innerHTML = '';

            if (news.length === 0) {
                container.innerHTML = '<div id="status-msg">Henüz yeni bir haber özeti bulunmuyor.</div>';
                return;
            }

            news.forEach(item => {
                const card = document.createElement('div');
                card.className = 'news-card';
                
                // Python timestamp formatını JS için düzeltme
                let dateStr = "GÜNCEL";
                if(item.timestamp) {
                    const cleanTs = item.timestamp.replace(' ', 'T');
                    const d = new Date(cleanTs);
                    if (!isNaN(d)) {
                        dateStr = d.toLocaleDateString('tr-TR', { 
                            day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' 
                        });
                    }
                }

                card.innerHTML = `
                    <div class="meta">${dateStr}</div>
                    <h2>${item.title}</h2>
                    <div class="audio-container">
                        <audio controls>
                            <source src="${item.url}" type="audio/mpeg">
                        </audio>
                    </div>
                `;
                container.appendChild(card);
            });
        } catch (e) {
            container.innerHTML = '<div id="status-msg">Haber akışına ulaşılamıyor.</div>';
        }
    }
    fetchNews();
</script>
</body>
</html>
